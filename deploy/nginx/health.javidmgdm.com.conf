# sales-health-check: health.javidmgdm.com → Docker app on loopback
#
# Multi-instance (Phase 8):
#   1. Start second app: docker compose -f docker-compose.nginx.yml -f docker-compose.scale.yml up -d
#   2. Uncomment the 3106 server line below
#   3. nginx -t && systemctl reload nginx
# Sticky sessions are NOT required (Redis rate-limit + BullMQ finish/SMS queues).
# Each app process uses DATABASE_URL …?connection_limit=10 via PgBouncer.

upstream sales_health_check {
    server 127.0.0.1:3105;
    # server 127.0.0.1:3106;
}

server {
    listen 80;
    server_name health.javidmgdm.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name health.javidmgdm.com;

    ssl_certificate /etc/letsencrypt/live/health.javidmgdm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health.javidmgdm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://sales_health_check;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
